<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cash Flow Minimizer</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #ffe4f0, #e8d3ff);
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 700px;
      margin: 50px auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #6b1fa7;
      font-size: 2.2rem;
    }

    .icon {
      font-size: 2rem;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 10px;
      color: #5c1a87;
      font-size: 1.1rem;
    }

    textarea {
      width: 100%;
      height: 120px;
      border: 2px solid #a65eea;
      border-radius: 10px;
      padding: 10px;
      font-size: 16px;
      background: #fffff0;
      resize: vertical;
    }

    button {
      display: block;
      width: 100%;
      background-color: #8e2de2;
      color: white;
      font-size: 1.1rem;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #a834eb;
    }

    .output {
      margin-top: 30px;
      background: #fffbe7;
      border-left: 6px solid #ffc107;
      padding: 20px;
      border-radius: 10px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px;
        padding: 20px;
      }

      h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><span class="icon">💰</span> Cash Flow Minimizer</h1>
    <label for="input">Enter transactions (one per line):</label>
    <textarea id="input" placeholder="Format: from to amount (e.g. 0 1 100)"></textarea>
    <button onclick="minimizeCashFlow()">Calculate</button>

    <div class="output">
      <h2><span class="icon">💡</span> Optimized Transactions:</h2>
      <div id="output"></div>
    </div>
  </div>

  <script>
    function minimizeCashFlow() {
      const input = document.getElementById("input").value.trim().split("\n");
      const transactions = [];
      let maxPerson = 0;

      input.forEach(line => {
        const parts = line.trim().split(/\s+/);
        if (parts.length === 3) {
          const from = parseInt(parts[0]);
          const to = parseInt(parts[1]);
          const amount = parseInt(parts[2]);
          if (!isNaN(from) && !isNaN(to) && !isNaN(amount)) {
            transactions.push({ from, to, amount });
            maxPerson = Math.max(maxPerson, from, to);
          }
        }
      });

      const net = Array(maxPerson + 1).fill(0);

      transactions.forEach(({ from, to, amount }) => {
        net[from] -= amount;
        net[to] += amount;
      });

      const result = [];

      function getMinIndex(arr) {
        let min = Infinity, idx = -1;
        for (let i = 0; i < arr.length; i++) {
          if (arr[i] < min) {
            min = arr[i];
            idx = i;
          }
        }
        return idx;
      }

      function getMaxIndex(arr) {
        let max = -Infinity, idx = -1;
        for (let i = 0; i < arr.length; i++) {
          if (arr[i] > max) {
            max = arr[i];
            idx = i;
          }
        }
        return idx;
      }

      function settleDebts(net) {
        const mxCredit = getMaxIndex(net);
        const mxDebit = getMinIndex(net);

        if (net[mxCredit] === 0 && net[mxDebit] === 0) return;

        const min = Math.min(-net[mxDebit], net[mxCredit]);
        net[mxCredit] -= min;
        net[mxDebit] += min;

        result.push(`Person ${mxDebit} pays ₹${min} to Person ${mxCredit}`);
        settleDebts(net);
      }

      settleDebts(net);

      document.getElementById("output").innerHTML = result.length
        ? result.map(r => `<p>${r}</p>`).join("")
        : "<p>No transactions to optimize.</p>";
    }
  </script>
</body>
</html>
